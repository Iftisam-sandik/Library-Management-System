services:
  backend:
    build:
      context: ./backend
    container_name: library-backend
    restart: unless-stopped
    env_file:
      - .env.backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: library-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
