---
- name: Configure Alertmanager
  hosts: monitoring_servers
  become: true

  vars:
    alertmanager_gmail_app_password: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_gmail_app_password') | trim }}

    alertmanager_smtp_username: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_smtp_username') | trim }}

    alertmanager_smtp_from: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_smtp_from') | trim }}

    alertmanager_email_to: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_email_to') | trim }}

  roles:
    - alertmanager
