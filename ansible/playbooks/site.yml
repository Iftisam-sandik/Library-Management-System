---
# ============================================================
# Production Observability Platform
# Top-level Ansible orchestration
# ============================================================

- name: Configure common monitoring agent
  hosts: all
  become: true

  roles:
    - node_exporter


# ============================================================
# Application servers
# ============================================================

- name: Configure application servers
  hosts: app_servers
  become: true

  vars:
    library_db_password: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/library_db_password') | trim }}

    library_jwt_secret: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/library_jwt_secret') | trim }}

  roles:
    - docker
    - app_deploy
    - cadvisor
    - alloy_app


# ============================================================
# Database server
# ============================================================

- name: Configure database server
  hosts: db_servers
  become: true

  vars:
    library_db_password: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/library_db_password') | trim }}

    mysqld_exporter_password: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/mysqld_exporter_password') | trim }}

  roles:
    - swap
    - mysql_server
    - library_database
    - mysqld_exporter
    - alloy_db


# ============================================================
# Monitoring server
# ============================================================

- name: Configure monitoring server
  hosts: monitoring_servers
  become: true

  vars:
    alertmanager_gmail_app_password: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_gmail_app_password') | trim }}

    alertmanager_smtp_username: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_smtp_username') | trim }}

    alertmanager_smtp_from: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_smtp_from') | trim }}

    alertmanager_email_to: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/alertmanager_email_to') | trim }}

    grafana_service_account_token: >-
      {{ lookup('ansible.builtin.file',
      '/home/ubuntu/.ansible-secrets/grafana_service_account_token') | trim }}

  roles:
    - blackbox_exporter
    - alertmanager
    - loki
    - prometheus
    - grafana
    - grafana_rbac
    - grafana_dashboards
    - alloy_monitoring
