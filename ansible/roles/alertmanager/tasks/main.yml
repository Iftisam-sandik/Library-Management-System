---
- name: Create Alertmanager group
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    system: true

- name: Create Alertmanager user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Alertmanager config directory
  ansible.builtin.file:
    path: /etc/alertmanager
    state: directory
    owner: root
    group: "{{ alertmanager_group }}"
    mode: "0750"

- name: Create Alertmanager data directory
  ansible.builtin.file:
    path: /var/lib/alertmanager
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"

- name: Download Alertmanager archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    mode: "0644"

- name: Extract Alertmanager archive
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"

- name: Install Alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"
    dest: /usr/local/bin/alertmanager
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart Alertmanager

- name: Install amtool binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/amtool"
    dest: /usr/local/bin/amtool
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Install Gmail App Password
  ansible.builtin.copy:
    content: "{{ alertmanager_gmail_app_password }}\n"
    dest: /etc/alertmanager/gmail_app_password
    owner: root
    group: "{{ alertmanager_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Alertmanager

- name: Install Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: root
    group: "{{ alertmanager_group }}"
    mode: "0640"
    validate: "/usr/local/bin/amtool check-config %s"
  no_log: true
  notify: Restart Alertmanager

- name: Install Alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Alertmanager

- name: Ensure Alertmanager is enabled and running
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started
