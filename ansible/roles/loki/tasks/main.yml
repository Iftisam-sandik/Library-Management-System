---
- name: Install Loki package prerequisites
  ansible.builtin.apt:
    name:
      - unzip
    state: present
    update_cache: true

- name: Create Loki group
  ansible.builtin.group:
    name: "{{ loki_group }}"
    system: true

- name: Create Loki user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Loki configuration directory
  ansible.builtin.file:
    path: /etc/loki
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Loki data directory
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0755"

- name: Download Loki archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
    dest: "/tmp/loki-{{ loki_version }}.zip"
    mode: "0644"

- name: Extract Loki binary
  ansible.builtin.unarchive:
    src: "/tmp/loki-{{ loki_version }}.zip"
    dest: "/tmp"
    remote_src: true
    creates: /tmp/loki-linux-amd64

- name: Install Loki binary
  ansible.builtin.copy:
    src: /tmp/loki-linux-amd64
    dest: /usr/local/bin/loki
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart Loki

- name: Install Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: /etc/loki/loki.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki

- name: Install Loki systemd service
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Loki

- name: Ensure Loki is enabled and running
  ansible.builtin.systemd:
    name: loki
    enabled: true
    state: started
