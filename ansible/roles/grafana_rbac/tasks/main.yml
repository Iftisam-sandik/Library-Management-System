        - teamId: "{{ grafana_operations_team_id | int }}"
          permission: 2
        - teamId: "{{ grafana_developers_team_id | int }}"
          permission: 1
        - teamId: "{{ grafana_qa_team_id | int }}"
          permission: 1
    status_code: 200
  when: >
    (grafana_db_acl.json | length != 4) or
    ((grafana_db_acl.json | selectattr('userId', 'defined')
      | selectattr('userId', 'equalto', grafana_admin_user_id | int)
      | selectattr('permission', 'equalto', 4) | list | length) != 1) or
    ((grafana_db_acl.json | selectattr('teamId', 'defined')
      | selectattr('teamId', 'equalto', grafana_operations_team_id | int)
