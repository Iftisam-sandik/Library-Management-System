---
- name: Ensure Grafana apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Ensure Alloy package is installed
  ansible.builtin.apt:
    name: alloy
    state: present

- name: Add Alloy user to journal access groups
  ansible.builtin.user:
    name: alloy
    groups:
      - adm
      - systemd-journal
    append: true
  notify: Restart Alloy

- name: Install Alloy MySQL journal configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Alloy

- name: Ensure Alloy is enabled and running
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
