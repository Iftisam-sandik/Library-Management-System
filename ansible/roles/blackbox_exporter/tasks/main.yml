---
- name: Create Blackbox Exporter group
  ansible.builtin.group:
    name: "{{ blackbox_exporter_group }}"
    system: true

- name: Create Blackbox Exporter user
  ansible.builtin.user:
    name: "{{ blackbox_exporter_user }}"
    group: "{{ blackbox_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Blackbox Exporter config directory
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Blackbox Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    mode: "0644"

- name: Extract Blackbox Exporter
  ansible.builtin.unarchive:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"

- name: Install Blackbox Exporter binary
  ansible.builtin.copy:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"
    dest: /usr/local/bin/blackbox_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart Blackbox Exporter

- name: Install Blackbox Exporter configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Blackbox Exporter

- name: Install Blackbox Exporter systemd service
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Blackbox Exporter

- name: Ensure Blackbox Exporter is enabled and running
  ansible.builtin.systemd:
    name: blackbox_exporter
    enabled: true
    state: started
